[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-detect-service"
version = "0.1.0"
description = "A FastAPI microservice that performs object detection on images using pretrained torchvision models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Samir Rafigzada", email = "rafigzadasamir@gmail.com" }]
keywords = ["computer-vision", "object-detection", "fastapi", "torchvision", "microservice"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    # Pinned to the 2.2.x / 0.17.x line: this is the combination verified to
    # work end to end in this repo's own local testing (see README). Newer
    # torch releases work fine on Linux/macOS CI; on Windows they can require
    # a newer MSVC runtime than ships by default, so a narrower, tested range
    # is kept here deliberately rather than an open-ended one.
    "torch>=2.2,<2.3",
    "torchvision>=0.17,<0.18",
    "pillow>=10.0,<12.0",
    "python-multipart>=0.0.9,<0.1",
    "pydantic>=2.6,<3.0",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
]
demo = [
    "streamlit>=1.33,<2.0",
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: FastAPI's `Depends(...)` is idiomatically used as an argument default
# (that's how the dependency-injection system works), so this check is a
# false positive for route handlers.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["vision_detect_service"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that download and run the real pretrained model (slow, network required).",
]
testpaths = ["tests"]
addopts = "-m 'not integration'"
