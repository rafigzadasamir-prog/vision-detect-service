name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only torch/torchvision
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # Runs unit/contract tests only -- pytest's default addopts (see
      # pyproject.toml) exclude @pytest.mark.integration tests, which exercise
      # the real pretrained model and are run manually; see README for why.
      - name: Run tests
        run: pytest -q
